name: CI

# The suite is worth having only if it runs without anyone remembering to
# run it. Postgres and Redis are real services here rather than mocks:
# pgvector's behaviour, the transactional test fixtures and the queue's
# delivery guarantees are all things a fake would get wrong quietly.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Same image as production: plain postgres has no vector type, and
        # the knowledge base is stored in one.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: workwell
          POSTGRES_USER: workwell
          POSTGRES_PASSWORD: workwell
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workwell"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-secret
      GEMINI_API_KEY: ci-key
      # Never the real provider in CI: the suite must not depend on a
      # vendor's availability, and a green build must not cost money.
      AI_PROVIDER: local
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: workwell_test
      POSTGRES_USER: workwell
      POSTGRES_PASSWORD: workwell
      REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches apps/backend/Dockerfile.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Preflight (deployment config)
        # Catches the class of mistake that only shows up on a deploy: a
        # Dockerfile that does not copy a package its own code imports.
        run: python scripts/preflight.py

      - name: Migrations apply to an empty database
        # The suite builds its schema with create_all, so without this the
        # migrations could drift from the models indefinitely.
        env:
          POSTGRES_DB: workwell
        run: alembic -c database/migrations/alembic.ini upgrade head

      - name: Migrations match the models
        env:
          POSTGRES_DB: workwell
        run: python scripts/check_migrations.py

      - name: Tests
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
