server {
    # Port 8080 so the container can run as an unprivileged user.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths must fall through to index.html or
    # a refresh on /timeline returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, otherwise clients pin an old bundle
    # and never pick up a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
