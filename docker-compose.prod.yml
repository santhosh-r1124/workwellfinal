# Production-shaped compose (Phase 21). Differences from the dev stack:
# no source bind-mounts, no dev server, no database port published to the
# host, secrets required from the environment rather than defaulted, and
# resource limits set so one service cannot starve the others.
#
# This is a single-host deployment. Multi-replica/managed-Postgres topology
# is described in docs/deployment.md.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: always
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?required}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:?required}
      APP_BASE_URL: ${APP_BASE_URL:?required}
      NOTIFICATION_CHANNEL: ${NOTIFICATION_CHANNEL:-log}
      INLINE_ANALYSIS_FALLBACK: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness: this gate decides whether the container is
      # put into service, so it must include the schema check.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g

  # Runs the daily sweep and everything else off the request path. One
  # replica is enough at this job volume; the queue's scheduler lock and
  # dedupe keys make more than one safe if you need it.
  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["python", "-m", "apps.worker"]
    restart: always
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?required}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:?required}
      APP_BASE_URL: ${APP_BASE_URL:?required}
      NOTIFICATION_CHANNEL: ${NOTIFICATION_CHANNEL:-log}
      # With a worker deployed, the API must never fall back to running an
      # analysis inline on a request.
      INLINE_ANALYSIS_FALLBACK: "false"
    depends_on:
      # The backend applies migrations on start and only reports ready once
      # the schema matches, so waiting on it keeps the worker from querying
      # columns that do not exist yet.
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # SIGTERM stops new reservations and lets in-flight jobs finish; a job
    # that outlives this has its lease expire and is picked up again.
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g

  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?required}
    restart: always
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m

  # Terminates TLS and is the only service published to the host. Expects
  # certificates mounted at ./docker/tls (see docs/deployment.md).
  proxy:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/tls:/etc/nginx/tls:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
