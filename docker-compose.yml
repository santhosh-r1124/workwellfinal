services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workwell}
      POSTGRES_USER: ${POSTGRES_USER:-workwell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workwell}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workwell} -d ${POSTGRES_DB:-workwell}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./agents:/app/agents
      - ./ml:/app/ml
      - ./rag:/app/rag
      - ./safety:/app/safety
      - ./integrations:/app/integrations
      - ./shared:/app/shared
      - ./database:/app/database
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # Same image as the backend, different command. This is what makes the
  # product run itself: without it nothing is analysed until someone opens
  # the assistant and asks.
  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["python", "-m", "apps.worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      # The backend applies migrations on start and only reports ready once
      # the schema matches, so waiting on it keeps the worker from querying
      # columns that do not exist yet.
      backend:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./apps/worker:/app/apps/worker
      - ./agents:/app/agents
      - ./ml:/app/ml
      - ./rag:/app/rag
      - ./safety:/app/safety
      - ./integrations:/app/integrations
      - ./shared:/app/shared
      - ./database:/app/database
      - ./scripts:/app/scripts

  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3300}:3300"
    depends_on:
      - backend
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules

volumes:
  postgres-data:
