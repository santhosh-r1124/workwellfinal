upstream workwell_backend {
    server backend:8000;
}

upstream workwell_frontend {
    server frontend:8080;
}

server {
    listen 80;
    server_name _;
    # ACME challenge should be served before the redirect if you use
    # certbot's webroot mode.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://workwell_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # agent orchestration can be slow
    }

    # Deliberately NOT proxied to the public internet: /metrics carries no
    # employee data but is operational surface that belongs on an internal
    # network or behind auth. Scrape it from inside the compose network.
    location /api/metrics {
        deny all;
    }

    location / {
        proxy_pass http://workwell_frontend;
        proxy_set_header Host $host;
    }
}
