[project]
name = "workwell-ai"
version = "0.1.0"
description = "WorkWell AI - Employee Wellness Early-Warning & Support Platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Ruff's default set (pycodestyle errors, pyflakes) plus import sorting.
# E501 is intentionally excluded: the formatter owns line width, and several
# user-facing privacy strings read better unwrapped.
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
line-length = 110
target-version = ["py311"]
